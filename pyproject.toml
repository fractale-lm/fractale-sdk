[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fractale"
version = "0.1.0"
description = "Usage kit for the Fractale models: language models whose long-term memory is a self-written fast-weight thought bank."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.40", "huggingface_hub>=0.23", "pyyaml"]

[project.urls]
Research = "https://github.com/kkuette/thought-bank"

[tool.setuptools.packages.find]
include = ["fractale*"]
